# DocMind self-hosted backend
#
# 部署模式:宝塔面板统一处理 SSL + 静态门户。
#   - 容器只跑 API + 静态门户,监听宿主机 loopback 8080
#   - 宝塔 Nginx 反代 doc-api / doc-web 两个子域 → 127.0.0.1:8080
#
# 微信支付凭据:
#   把商户 API 私钥(apiclient_key.pem)和微信支付平台证书(wechatpay_cert.pem)
#   放到 ./data/wechat/ 下。容器读取的路径已经在 environment 里配好。
#
# Usage:
#   1. cp .env.example .env && vi .env
#   2. mkdir -p data/wechat && 把两个 PEM 复制进去
#   3. docker compose up -d

services:
  docmind-server:
    image: ${IMAGE_TAG:-registry.cn-qingdao.aliyuncs.com/boyocloud/docmind-server:latest}
    container_name: docmind-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    environment:
      DOMAIN: ${DOMAIN:-doc-api.boyobang.com}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-doc-web.boyobang.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # 微信支付 — 6 项凭据,缺一不可
      WECHAT_MCH_ID: ${WECHAT_MCH_ID}
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY}
      WECHAT_MCH_CERT_SERIAL_NO: ${WECHAT_MCH_CERT_SERIAL_NO}
      WECHAT_MCH_PRIVATE_KEY_PATH: /data/wechat/apiclient_key.pem
      WECHAT_PLATFORM_CERT_PATH: /data/wechat/wechatpay_cert.pem
      WECHAT_PLATFORM_KEY_ID: ${WECHAT_PLATFORM_KEY_ID}   # 形如 PUB_KEY_ID_xxx,可选,用作回调防御性校验
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL:-https://doc-api.boyobang.com/api/v1/payment/wechat/webhook}

      PRICE_LIFETIME_FEN: ${PRICE_LIFETIME_FEN:-2000}
