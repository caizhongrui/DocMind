# DocMind self-hosted backend — single container, single command deploy.
#
# Usage:
#   1. Copy .env.example to .env and fill in your secrets.
#   2. docker compose up -d
#
# All persistent state (SQLite database, Ed25519 private key, uploaded
# release binaries) lives in ./data — back this up.

services:
  docmind-server:
    image: docmind/server:latest
    # If you don't have the prebuilt image yet, replace `image:` with `build: .`
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docmind-server
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
      LISTEN_ADDR: 127.0.0.1:8080
      DOMAIN: ${DOMAIN:-api.docmind.app}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-docmind.app}
      ACME_EMAIL: ${ACME_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PAYJS_MERCHANT_ID: ${PAYJS_MERCHANT_ID}
      PAYJS_KEY: ${PAYJS_KEY}
      PAYJS_NOTIFY_URL: ${PAYJS_NOTIFY_URL:-https://api.docmind.app/api/v1/payment/payjs/webhook}
      PRICE_LIFETIME_FEN: ${PRICE_LIFETIME_FEN:-2000}
      RUST_LOG: ${RUST_LOG:-info,docmind_server=debug}
