name: Build DocMind

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Common Tauri signing env, reused by every build job.
env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  # ── macOS Apple Silicon (M-series) ────────────────────────────────────
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest          # macos-14+ runners are Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-arm64

      - run: npm ci

      - name: Build (aarch64-apple-darwin)
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          # llama.cpp 用 std::filesystem,要求 macOS 10.15+
          MACOSX_DEPLOYMENT_TARGET: "10.15"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  # ── macOS Intel ───────────────────────────────────────────────────────
  build-macos-x64:
    name: Build macOS x64 (Intel)
    runs-on: macos-13              # GitHub's last x86_64 macOS runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-x64

      - run: npm ci

      - name: Build (x86_64-apple-darwin)
        run: npm run tauri build -- --target x86_64-apple-darwin
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  # ── Windows x64 ───────────────────────────────────────────────────────
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 包含 .cargo/config.toml 哈希，CRT 标志变化时缓存失效
          key: windows-x64-${{ hashFiles('src-tauri/.cargo/config.toml') }}

      - run: npm ci

      - name: Build (x86_64-pc-windows-msvc)
        run: npm run tauri build
        env:
          # 强制 cc crate 编译的 C/C++ 用动态 CRT (/MD)，
          # 与 ort_sys (ONNX Runtime) / llama_cpp_sys_2 预编译库一致
          CFLAGS: /MD
          CXXFLAGS: /MD

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig

  # ── Tag 推送时,把三个平台的产物挂到 GitHub Release ────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-macos-arm64, build-macos-x64, build-windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DocMind ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/macos-arm64/dmg/*.dmg
            artifacts/macos-arm64/macos/*.app.tar.gz
            artifacts/macos-arm64/macos/*.app.tar.gz.sig
            artifacts/macos-x64/dmg/*.dmg
            artifacts/macos-x64/macos/*.app.tar.gz
            artifacts/macos-x64/macos/*.app.tar.gz.sig
            artifacts/windows-x64/nsis/*.exe
            artifacts/windows-x64/nsis/*.exe.sig
            artifacts/windows-x64/msi/*.msi
            artifacts/windows-x64/msi/*.msi.sig
