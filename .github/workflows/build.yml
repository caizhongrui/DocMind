name: Build DocMind

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Common Tauri signing env, reused by every build job.
env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  # ── macOS Apple Silicon (M-series) ────────────────────────────────────
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-latest          # macos-14+ runners are Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-arm64

      - run: npm ci

      - name: Build (aarch64-apple-darwin)
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          # llama.cpp 用 std::filesystem,要求 macOS 10.15+
          MACOSX_DEPLOYMENT_TARGET: "10.15"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  # ── macOS Intel:暂不构建 ───────────────────────────────────────────
  # GitHub 的 macos-13 runner 池排队动辄 10+ 小时,不再值得。如果以后
  # 真有 Intel Mac 用户,有两个选项:
  #   (1) 自托管一台 Intel Mac runner
  #   (2) 改回 universal binary (单 .app 同时包含 arm64 + x86_64),
  #       在 macos-latest (Apple Silicon) 上交叉编译,但 Tauri updater
  #       平台键需要服务端把 darwin-x86_64 映射到 darwin-aarch64 的同
  #       一份 manifest。

  # ── Windows x64 ───────────────────────────────────────────────────────
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # 包含 .cargo/config.toml 哈希，CRT 标志变化时缓存失效
          key: windows-x64-${{ hashFiles('src-tauri/.cargo/config.toml') }}

      - run: npm ci

      # Code-sign the produced .exe / .msi when an OV certificate is
      # available. Skipped on PRs and when the secrets aren't set,
      # so unsigned builds still go through. Once you've bought a
      # Sectigo OV cert and added the two secrets below, every Windows
      # build will be signed automatically:
      #   WINDOWS_CERTIFICATE          base64 of the .pfx file
      #   WINDOWS_CERTIFICATE_PASSWORD .pfx password
      - name: Decode signing certificate (if available)
        id: cert
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "WINDOWS_CERTIFICATE secret not set — building unsigned."
            "thumbprint=" | Out-File $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfxPath = Join-Path $env:RUNNER_TEMP "docmind-cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          $pwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath `
                    -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          "thumbprint=$($cert.Thumbprint)" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "imported cert thumbprint: $($cert.Thumbprint)"
          Remove-Item $pfxPath

      - name: Build (x86_64-pc-windows-msvc)
        run: npm run tauri build
        env:
          # 强制 cc crate 编译的 C/C++ 用动态 CRT (/MD)，
          # 与 ort_sys (ONNX Runtime) / llama_cpp_sys_2 预编译库一致
          CFLAGS: /MD
          CXXFLAGS: /MD
          # When the cert step ran, hand its thumbprint to Tauri so the
          # bundler invokes signtool against signed .exe / .msi outputs.
          # If empty (no cert), Tauri still builds — just unsigned.
          TAURI_SIGNING_CERTIFICATE_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig

  # ── Tag 推送时,把三个平台的产物挂到 GitHub Release ────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-macos-arm64, build-windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DocMind ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/macos-arm64/dmg/*.dmg
            artifacts/macos-arm64/macos/*.app.tar.gz
            artifacts/macos-arm64/macos/*.app.tar.gz.sig
            artifacts/windows-x64/nsis/*.exe
            artifacts/windows-x64/nsis/*.exe.sig
            artifacts/windows-x64/msi/*.msi
            artifacts/windows-x64/msi/*.msi.sig

  # ── Push the updater bundles to the doc-api server so the in-app
  #    updater can pick them up. Runs after the GitHub Release is up.
  publish-to-docapi:
    name: Publish updater bundles to doc-api
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 必须先 checkout, 再 download-artifact ——
      # actions/checkout@v4 默认 clean: true 会把 untracked 的 artifacts/
      # 当垃圾删掉, 后续 publish 步骤 glob 啥也匹配不到 (这就是 v0.2.0
      # 上传到 GitHub Release 成功但 doc-api 没收到新版本的根因)。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # need full tag history for git tag -l --format

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Capture release notes (prefer annotated tag message)
        id: relbody
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          # Prefer the annotated tag's own message (the user-facing changelog
          # passed to `./scripts/release.sh 0.1.x "..."`). Fall back to the
          # GitHub-auto-generated body only when the tag is lightweight
          # (no message). This keeps the doc-api / portal changelog showing
          # what the maintainer wrote, not "Full Changelog: ..." commit list.
          tag_msg="$(git tag -l --format='%(contents:body)' "$VERSION")"
          if [ -z "$(echo "$tag_msg" | tr -d '[:space:]')" ]; then
            tag_msg="$(git tag -l --format='%(contents)' "$VERSION")"
          fi
          if [ -z "$(echo "$tag_msg" | tr -d '[:space:]')" ]; then
            echo "▸ tag message empty, falling back to GitHub-generated body"
            tag_msg="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          else
            echo "▸ using annotated tag message ($(echo "$tag_msg" | wc -l | tr -d ' ') lines)"
          fi
          echo "$tag_msg" | head -8
          {
            echo "body<<DOCMIND_NOTES_EOF"
            echo "$tag_msg"
            echo "DOCMIND_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish each platform's updater bundle
        env:
          PUBLISH_URL: ${{ vars.DOCAPI_PUBLISH_URL || 'https://doc-api.boyobang.com/api/v1/releases/publish' }}
          PUBLISH_TOKEN: ${{ secrets.RELEASES_PUBLISH_TOKEN }}
          VERSION: ${{ github.ref_name }}
          RELEASE_BODY: ${{ steps.relbody.outputs.body }}
        run: |
          set -euo pipefail
          # nullglob: 匹配不到时让 glob 直接展成空数组而不是字面量(避免
          # ls "literal *" 出错),这样我们可以可靠地用 ${arr[0]:-} 取首项。
          shopt -s nullglob
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::RELEASES_PUBLISH_TOKEN secret not set — skipping doc-api sync"
            exit 1
          fi
          # Strip the leading "v" so the doc-api version column matches
          # what the in-app updater sends ("0.1.3", not "v0.1.3").
          version="${VERSION#v}"

          publish() {
            local platform="$1" updater="$2" sig="$3"
            if [ ! -f "$updater" ]; then
              echo "::warning::no updater bundle for $platform (path=\"$updater\") — skipping"
              return
            fi
            if [ ! -f "$sig" ]; then
              echo "::warning::no signature for $platform (path=\"$sig\") — skipping"
              return
            fi
            echo "▸ uploading $platform: $(basename "$updater")"
            curl -fsSL -X POST "$PUBLISH_URL" \
              -H "Authorization: Bearer $PUBLISH_TOKEN" \
              -F "version=$version" \
              -F "platform=$platform" \
              -F "notes=$RELEASE_BODY" \
              -F "signature=$(cat "$sig")" \
              -F "binary=@$updater" \
              | tee /dev/stderr
            echo
          }

          # macOS arm64 — bash glob, no pipe (避免 SIGPIPE 让 ls 异常退出导致
          # $(ls X | head -1) 返回空)
          mac_arm64_app=(artifacts/macos-arm64/macos/*.app.tar.gz)
          mac_arm64_sig=(artifacts/macos-arm64/macos/*.app.tar.gz.sig)
          publish "darwin-aarch64" "${mac_arm64_app[0]:-}" "${mac_arm64_sig[0]:-}"

          # macOS x64 (Intel) — currently disabled, see workflow header.

          # Windows x64 — Tauri's NSIS updater bundle is the .exe itself
          # (signed by the .exe.sig file alongside it).
          win_exe=(artifacts/windows-x64/nsis/*.exe)
          win_sig=(artifacts/windows-x64/nsis/*.exe.sig)
          publish "windows-x86_64" "${win_exe[0]:-}" "${win_sig[0]:-}"

          echo "✓ doc-api sync complete"
