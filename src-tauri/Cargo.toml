[package]
name = "docmind"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "docmind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
lopdf = "0.32"
pdf-extract = "0.7"
calamine = { version = "0.24", features = ["dates"] }
zip = "2"
quick-xml = "0.36"
tantivy = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io", "codec"] }
base64 = "0.22"

# macOS：fsevent 文件监听优化 + Metal GPU 加速 + ONNX 语义搜索
[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "6", features = ["macos_fsevent"] }
llama-cpp-2 = { version = "0.1", features = ["metal"] }
ort = { version = "2.0.0-rc.11", features = ["download-binaries"] }
tokenizers = "0.19"
ndarray = "0.15"

# Windows / Linux：polling 文件监听（不含本地 LLM，使用 API 模式）
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify = "6"

[dev-dependencies]
tempfile = "3"
