# /www/server/panel/vhost/nginx/doc-api.boyobang.com.conf
# 宝塔面板 → 网站 → 添加站点 doc-api.boyobang.com,然后把这段配置粘贴到
# "网站设置 → 配置文件" 中(覆盖默认 server 块,保留宝塔自动生成的 SSL 部分)。
#
# 关键点:
#   - 反向代理到 Docker 容器(127.0.0.1:8080)
#   - 透传 Host / X-Real-IP / X-Forwarded-For
#   - client_max_body_size 200M:管理员上传二进制安装包要传到 ~100MB
#   - 大文件 / 流式响应禁用缓冲,避免 Nginx 缓存整个文件

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2  on;
    server_name  doc-api.boyobang.com;

    # ssl_certificate / ssl_certificate_key 由宝塔自动管理,这里不用写
    # access_log / error_log 也用宝塔默认即可

    client_max_body_size 200M;

    # 反向代理到 Docker 容器
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 流式响应(license server 当前没有 SSE,但留下兼容)
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # /releases/* 是大文件下载路径,可以单独调更长超时
    location /releases/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_read_timeout 600s;
    }
}

# HTTP → HTTPS 强跳(宝塔通常默认会加,这段当兜底)
server {
    listen 80;
    listen [::]:80;
    server_name doc-api.boyobang.com;
    return 301 https://$host$request_uri;
}
