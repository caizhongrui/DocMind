# 宝塔站点 doc-web.boyobang.com 的 Nginx 配置(参考)
#
# 门户站静态文件已经被打包进 Docker 容器(/app/portal),由容器内的 Caddy
# 通过 Host 头识别后 file_server 出去。宝塔 Nginx 只负责终止 SSL + 反代。

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2  on;
    server_name  doc-web.boyobang.com;

    # ssl_certificate / ssl_certificate_key 由宝塔自动管理

    # 反代到容器内 Caddy(:8080),Host 透传是关键
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;        # ← Caddy 靠这个分流
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering    off;
        proxy_read_timeout 60s;
    }

    # 安全头(Caddy 也会下发,这里冗余但无害)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

server {
    listen 80;
    listen [::]:80;
    server_name doc-web.boyobang.com;
    return 301 https://$host$request_uri;
}
