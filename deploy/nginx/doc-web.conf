# /www/server/panel/vhost/nginx/doc-web.boyobang.com.conf
# 宝塔面板 → 网站 → 添加站点 doc-web.boyobang.com,根目录指向你上传 portal 静态产物
# 的位置(比如 /www/wwwroot/docmind-portal/),然后用本配置作为 "网站设置 → 配置文件"。

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2  on;
    server_name  doc-web.boyobang.com;

    # ssl_certificate / ssl_certificate_key 由宝塔自动管理

    root /www/wwwroot/docmind-portal;
    index index.html;

    # gzip / brotli 已经由宝塔默认开启,这里不重复配置

    # 缓存 hashed 资源(Astro 在 _astro/ 下生成 hash 文件名)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 其他静态资源(图片/字体)缓存中等时长
    location ~* \.(woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 文档/页面 — Astro 输出的是目录形式 (e.g. /pricing/index.html)
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
        add_header Cache-Control "public, max-age=300";
    }

    # 安全头
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-Frame-Options "DENY";
}

server {
    listen 80;
    listen [::]:80;
    server_name doc-web.boyobang.com;
    return 301 https://$host$request_uri;
}
